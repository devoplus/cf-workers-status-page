name = 'cf-workers-status-page-production'
main = 'index.js'
workers_dev = true
compatibility_date = "2026-10-20"

# Builds generated/config.json and ./out (style.css, client.js, public files)
# before `wrangler dev` and `wrangler deploy`; only needs `node`, so it also
# works when wrangler is started without a global `yarn` (e.g. via npx)
[build]
command = "node scripts/build.js"
watch_dir = ["src", "pages", "public"]

# Static files are served before the Worker; "/" falls through to index.js
[assets]
directory = "./out"

[triggers]
crons = ["* * * * *"]

# uncomment and adjust following if you are not using GitHub Actions
# (`yarn deploy` deploys this top-level Worker; the GitHub Actions workflow adds
# its own [env.production] and deploys "<name>-production" instead)
# Use the id of the EXISTING namespace: a binding without id makes
# `wrangler deploy` provision a new, empty namespace.
#[[kv_namespaces]]
#binding = "KV_STATUS_PAGE"
#id = "xxxx"
#
#[[routes]]
#pattern = "xxx"
#zone_id = "xxx"
