name = 'cf-workers-status-page-production'
main = 'index.js'
workers_dev = true
compatibility_date = "2026-10-20"

# Builds generated/config.json and ./out (style.css, client.js, public files)
# before `wrangler dev` and `wrangler deploy`; only needs `node`, so it also
# works when wrangler is started without a global `yarn` (e.g. via npx)
[build]
command = "node scripts/build.js"
watch_dir = ["src", "pages", "public"]

# Static files are served before the Worker; "/" falls through to index.js
[assets]
directory = "./out"

[triggers]
crons = ["* * * * *"]

# No id on purpose: on `wrangler deploy` / `versions upload` Wrangler 4 reuses
# the KV_STATUS_PAGE binding the deployed Worker already has, so the live data
# stays attached; only a Worker without that binding gets a new namespace
# (wrangler 4.153 KVHandler.canInherit + default-on resource provisioning).
# Set `id` to pin a specific namespace. The GitHub Actions workflow adds its own
# [env.production] binding and deploys "<name>-production" instead.
[[kv_namespaces]]
binding = "KV_STATUS_PAGE"

# uncomment and adjust following to serve the page on a custom domain
#[[routes]]
#pattern = "xxx"
#zone_id = "xxx"
