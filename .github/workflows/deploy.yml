name: Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn
    - run: yarn install --frozen-lockfile
    - run: yarn build
      env:
        NODE_ENV: production
    # Uses the KV_NAMESPACE_ID repository variable when set; otherwise reuses the
    # single namespace whose title contains KV_STATUS_PAGE, creates one only when
    # none exists and stops when several match (binding the wrong one would hide
    # the existing data). The id is bound to [env.production] for this deployment.
    - name: Resolve KV namespace
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      run: |
        find_kv_id() {
          yarn --silent wrangler kv namespace list | node -e "
            const matches = JSON.parse(require('fs').readFileSync(0, 'utf8')).filter((ns) => ns.title.includes('KV_STATUS_PAGE'))
            if (matches.length > 1) {
              console.error('Several KV namespaces match KV_STATUS_PAGE, set the KV_NAMESPACE_ID repository variable: ' + matches.map((ns) => ns.title + ' (' + ns.id + ')').join(', '))
              process.exit(1)
            }
            process.stdout.write(matches.length ? matches[0].id : '')"
        }
        if [ -z "$KV_NAMESPACE_ID" ]; then
          KV_NAMESPACE_ID=$(find_kv_id)
        fi
        if [ -z "$KV_NAMESPACE_ID" ]; then
          yarn --silent wrangler kv namespace create KV_STATUS_PAGE
          KV_NAMESPACE_ID=$(find_kv_id)
        fi
        [ -n "$KV_NAMESPACE_ID" ] || { echo "KV_STATUS_PAGE namespace not found"; exit 1; }
        echo "KV_NAMESPACE_ID=${KV_NAMESPACE_ID}" >> "$GITHUB_ENV"
        printf '\n[env.production]\nkv_namespaces = [{binding="KV_STATUS_PAGE", id="%s"}]\n' "${KV_NAMESPACE_ID}" >> wrangler.toml
    - name: Publish
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: ${{ secrets.CF_ACCOUNT_ID }}
        packageManager: yarn
        secrets: |
          SECRET_SLACK_WEBHOOK_URL
          SECRET_TELEGRAM_API_TOKEN
          SECRET_TELEGRAM_CHAT_ID
          SECRET_DISCORD_WEBHOOK_URL
        environment: production
      env:
        # the Worker skips notifications that still carry this placeholder
        SECRET_SLACK_WEBHOOK_URL: ${{ secrets.SECRET_SLACK_WEBHOOK_URL || 'default-gh-action-secret' }}
        SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN || 'default-gh-action-secret' }}
        SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID || 'default-gh-action-secret' }}
        SECRET_DISCORD_WEBHOOK_URL: ${{ secrets.SECRET_DISCORD_WEBHOOK_URL || 'default-gh-action-secret' }}
    # gcMonitors.js exits 0 when a variable is missing, so make that visible
    - name: Clean up KV monitors state
      run: |
        if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ] || [ -z "$KV_NAMESPACE_ID" ]; then
          echo "::warning::kv-gc skipped: CF_ACCOUNT_ID, CF_API_TOKEN or KV_NAMESPACE_ID is empty"
        fi
        yarn kv-gc
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
