name: Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn
    - run: yarn install --frozen-lockfile
    - run: yarn build
      env:
        NODE_ENV: production
    # Reuses an existing KV_STATUS_PAGE namespace and only creates one when none
    # exists, then binds it to [env.production] for this deployment
    - name: Resolve KV namespace
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: |
        find_kv_id() {
          yarn --silent wrangler kv namespace list | node -e "const kv = JSON.parse(require('fs').readFileSync(0, 'utf8')).find((ns) => ns.title.includes('KV_STATUS_PAGE')); process.stdout.write(kv ? kv.id : '')"
        }
        KV_NAMESPACE_ID=$(find_kv_id)
        if [ -z "$KV_NAMESPACE_ID" ]; then
          yarn --silent wrangler kv namespace create KV_STATUS_PAGE
          KV_NAMESPACE_ID=$(find_kv_id)
        fi
        [ -n "$KV_NAMESPACE_ID" ] || { echo "KV_STATUS_PAGE namespace not found"; exit 1; }
        echo "KV_NAMESPACE_ID=${KV_NAMESPACE_ID}" >> "$GITHUB_ENV"
        printf '\n[env.production]\nkv_namespaces = [{binding="KV_STATUS_PAGE", id="%s"}]\n' "${KV_NAMESPACE_ID}" >> wrangler.toml
    - name: Publish
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: ${{ secrets.CF_ACCOUNT_ID }}
        packageManager: yarn
        secrets: |
          SECRET_SLACK_WEBHOOK_URL
          SECRET_TELEGRAM_API_TOKEN
          SECRET_TELEGRAM_CHAT_ID
          SECRET_DISCORD_WEBHOOK_URL
        environment: production
      env:
        # the Worker skips notifications that still carry this placeholder
        SECRET_SLACK_WEBHOOK_URL: ${{ secrets.SECRET_SLACK_WEBHOOK_URL || 'default-gh-action-secret' }}
        SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN || 'default-gh-action-secret' }}
        SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID || 'default-gh-action-secret' }}
        SECRET_DISCORD_WEBHOOK_URL: ${{ secrets.SECRET_DISCORD_WEBHOOK_URL || 'default-gh-action-secret' }}
    - name: Clean up KV monitors state
      run: yarn kv-gc
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
